{% extends "base.html" %}
{% block title %}Change Password | BAU Seminar Management{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5 col-lg-4">
        <div class="section-card p-4">
            <h1 class="h4 mb-1"><i class="bi bi-shield-lock me-1"></i>Set New Password</h1>
            <p class="text-muted small mb-3">You logged in with a temporary password. Please choose a new password to continue.</p>

            <form method="post">
                <div class="mb-3">
                    <label for="new_password" class="form-label">New Password</label>
                    <input type="password" id="new_password" name="new_password" class="form-control" placeholder="At least 8 characters" required minlength="8" autofocus>
                </div>
                <div class="mb-3">
                    <label for="confirm_password" class="form-label">Confirm New Password</label>
                    <input type="password" id="confirm_password" name="confirm_password" class="form-control" placeholder="Repeat your new password" required minlength="8">
                </div>
                <button type="submit" class="btn btn-primary w-100">
                    <i class="bi bi-check-circle me-1"></i>Save New Password
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
