{% extends "base.html" %}
{% block title %}Login | BAU Seminar Management{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5 col-lg-4">
        <div class="section-card p-4">
            <div class="text-center mb-3">
                <div class="brand-logo mx-auto mb-3">
                    <img src="{{ url_for('static', filename='img/bau_logo.png') }}" alt="BAU Logo" style="height: 60px; width: auto;">
                </div>
                <h1 class="h4 mb-1">BAU Admin Login</h1>
                <p class="text-muted small">Seminar & Summit Management System</p>
            </div>
            <form action="{{ url_for('login') }}" method="post">
                <div class="mb-3">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" id="email" name="email" class="form-control" placeholder="admin@bau.edu.tr" value="{{ email or '' }}" required>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" id="password" name="password" class="form-control" placeholder="Enter password" required>
                </div>
                <button type="submit" class="btn btn-primary w-100 mb-2">
                    <i class="bi bi-box-arrow-in-right me-1"></i>Login
                </button>
                <div class="text-center">
                    <a href="{{ url_for('forgot_password') }}" class="small text-muted">Forgot Password?</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
